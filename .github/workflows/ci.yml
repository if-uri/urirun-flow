name: ci

# Package CI for the real-source `urirun_flow` owner. The suite imports runtime-backed
# planner and recovery modules, so install the declared `run` extra as well as `test`.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,run]"
          python -m pytest tests -q
          urirun-flow --help
